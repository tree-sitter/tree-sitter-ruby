name: Publish release

on:
  push:
    tags: ["*"]
  # Publishes the packages of a tag pushed before the tokens existed: gh workflow run publish.yml --ref v0.25.0
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  github:
    if: github.event_name == 'push'
    uses: tree-sitter/workflows/.github/workflows/release.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main@2026-11-18

  # Off until the registry tokens exist: set the repository variable PUBLISH_PACKAGES to true
  npm:
    if: vars.PUBLISH_PACKAGES == 'true'
    uses: tree-sitter/workflows/.github/workflows/package-npm.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main@2026-11-18
    with:
      package-name: "@magikdidi24/tree-sitter-ruby"
    secrets:
      NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
  crates:
    if: vars.PUBLISH_PACKAGES == 'true'
    uses: tree-sitter/workflows/.github/workflows/package-crates.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main@2026-11-18
    with:
      package-name: tree-sitter-ruby-magikdidi24
    secrets:
      CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}
  pypi:
    if: vars.PUBLISH_PACKAGES == 'true'
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main@2026-11-18
    with:
      package-name: tree-sitter-ruby-magikdidi24
    secrets:
      PYPI_API_TOKEN: ${{secrets.PYPI_API_TOKEN}}
