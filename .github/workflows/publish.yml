name: Publish release

on:
  push:
    tags: ["*"]
  # Publishes the packages of a tag pushed before: gh workflow run publish.yml --ref v0.25.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  github:
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: tree-sitter/workflows/.github/workflows/release.yml@dca539e07998ac429e185349d3dd194d2c7418d3 # main@2026-11-18

  # The registry jobs log in with OIDC (trusted publishing): no token is stored in the repository.
  # They are off until the repository variable PUBLISH_PACKAGES is true.
  npm-wasm:
    name: Build the Wasm parser
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          tree-sitter-ref: v0.27.2
      - name: Build the Wasm parser
        run: tree-sitter build --wasm
      - name: Upload the Wasm parser
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-wasm
          path: "*.wasm"
          retention-days: 2

  npm-node:
    name: Build the Node binding on ${{matrix.os}}
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [windows-2022, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --omit peer --omit optional
      - name: Build the binding
        run: npm x -- prebuildify -t 20.19.5
      - name: Upload the binding
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilds-${{matrix.os}}
          path: prebuilds/**
          retention-days: 2

  npm:
    name: Publish to npm
    needs: [npm-wasm, npm-node]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm 11.5.1 or newer, which Node 24 ships, logs in with OIDC
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: prebuilds
          pattern: prebuilds-*
          merge-multiple: true
      - name: Move the Wasm parser to the root
        run: mv -v prebuilds/*.wasm .
      - name: Publish
        run: npm publish

  pypi-sdist:
    name: Build the Python source dist
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the source dist
        run: |
          pip install --upgrade build setuptools
          python -m build --no-isolation --sdist
      - name: Upload the source dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sources
          path: dist/*.tar.gz
          retention-days: 2

  pypi-wheels:
    name: Build Python wheels on ${{matrix.os}}
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [windows-2025, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: native
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wheels-${{matrix.os}}
          path: dist/*.whl
          retention-days: 2

  pypi:
    name: Publish to PyPI
    needs: [pypi-sdist, pypi-wheels]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  crates:
    name: Publish to crates.io
    if: vars.PUBLISH_PACKAGES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{steps.auth.outputs.token}}
