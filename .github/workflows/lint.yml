name: Lint

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - deno.json
  pull_request:
    paths:
      - grammar.js
      - deno.json

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Lint grammar.js
        run: deno lint
