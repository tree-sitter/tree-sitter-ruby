name: Playground

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - script/coverage.sh
      - script/corpus_inputs.rb
      - script/sanitize.c
      - .github/workflows/playground.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and the latest wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the playground and the coverage badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@faab9a23fa6195da0f1cf868219cc1e89f238d3d # v2
        with:
          tree-sitter-ref: v0.27.2
      - name: Build the parser to wasm
        run: tree-sitter build --wasm
      - name: Export the playground
        run: tree-sitter playground --export site
      # The runtime's source comes from the Rust dev-dependency, checked against Cargo.lock
      - name: Fetch the tree-sitter runtime
        run: cargo fetch --locked
      - name: Write the coverage badge
        run: script/coverage.sh site/coverage.json
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
