name: Fuzz Parser

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
  pull_request:
    paths:
      - grammar.js
      - src/**

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@v4
        with:
          corpus: test/highlight
