name: Fuzz Parser

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - script/adversarial.rb
      - script/sanitize.c
  pull_request:
    paths:
      - grammar.js
      - src/**
      - script/adversarial.rb
      - script/sanitize.c
  # Nightly: an hour of fuzzing from the corpus kept by earlier nights
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the corpus of earlier nights
        if: github.event_name == 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{github.run_id}}
          restore-keys: fuzz-corpus-
      - name: Seed the corpus
        if: github.event_name == 'schedule'
        run: mkdir -p fuzz-corpus && cp test/highlight/* fuzz-corpus/
      - name: Run fuzzer
        uses: tree-sitter/fuzz-action@6a1dcff00aefd038ba418bd63732a9add4901266 # v4
        with:
          corpus: ${{github.event_name == 'schedule' && 'fuzz-corpus' || 'test/highlight'}}
          max-time: ${{github.event_name == 'schedule' && 3600 || 60}}
      # libFuzzer writes the inputs it finds to out/ in the action's directory, not to the corpus it reads
      - name: Keep the new inputs
        if: github.event_name == 'schedule'
        run: cp -r "$GITHUB_WORKSPACE"/../../_actions/tree-sitter/fuzz-action/*/out/. fuzz-corpus/

  sanitizers:
    name: ASan and UBSan on the inputs that once broke the scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runtime's source comes from the Rust dev-dependency, checked against Cargo.lock
      - name: Fetch the tree-sitter runtime
        run: cargo fetch --locked
      - name: Build the parser with sanitizers
        run: |
          version=$(sed -n '/^name = "tree-sitter"$/{n;s/^version = "\(.*\)"$/\1/p}' Cargo.lock)
          lib=$(ls -d ~/.cargo/registry/src/*/tree-sitter-"$version")
          clang -std=gnu11 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g -O1 \
            -Isrc -I"$lib/include" script/sanitize.c src/parser.c src/scanner.c "$lib/src/lib.c" -o sanitize
      - name: Generate the inputs
        run: ruby script/adversarial.rb adversarial
      - name: Parse them
        run: ./sanitize adversarial/*.rb
