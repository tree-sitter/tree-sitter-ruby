name: CodeQL

on:
  push:
    branches: [master]
    paths:
      - src/scanner.c
      - src/locals.h
      - .github/workflows/codeql.yml
  pull_request:
    paths:
      - src/scanner.c
      - src/locals.h
      - .github/workflows/codeql.yml
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze the scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      # Only the hand-written C: parser.c is generated
      - name: Compile the scanner
        run: cc -std=c99 -Isrc -c src/scanner.c -o scanner.o
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
